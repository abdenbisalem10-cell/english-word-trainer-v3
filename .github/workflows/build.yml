name: Build AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find and Unzip source code
      run: |
        echo "Current directory files:"
        ls -la
        # البحث عن أي ملف zip في المستودع
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "Error: No zip file found!"
          exit 1
        fi
        echo "Found zip file: $ZIP_FILE"
        mkdir -p extracted_project
        unzip -q "$ZIP_FILE" -d extracted_project
        echo "Extracted contents:"
        ls -R extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Release AAB
      run: |
        # البحث عن مجلد gradlew أوتوماتيكياً
        GRADLE_DIR=$(find extracted_project -name gradlew -exec dirname {} \; | head -n 1)
        echo "Found Gradle in: $GRADLE_DIR"
        cd "$GRADLE_DIR"
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: EnglishWordTrainer-AAB
        path: extracted_project/**/build/outputs/bundle/release/*.aab
